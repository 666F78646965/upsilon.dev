<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escobar International Airport - Vice City 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0518;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .font-vice {
            font-family: 'Pacifico', cursive;
        }
        .font-hud {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-pink-text {
            color: #ff6ec7;
            text-shadow: 0 0 6px #ff1493, 0 0 14px #ff1493, 0 0 28px #b0006d;
        }
        .neon-cyan-text {
            color: #5ce1e6;
            text-shadow: 0 0 6px #00e5ff, 0 0 14px #00b8d4;
        }
        .glass-panel {
            background: rgba(15, 10, 32, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 110, 199, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55), inset 0 0 12px rgba(92, 225, 230, 0.12);
        }
        .btn-vice {
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(92, 225, 230, 0.35);
        }
        .btn-vice:hover {
            background: rgba(255, 110, 199, 0.28);
            border-color: #ff6ec7;
            box-shadow: 0 0 12px rgba(255, 110, 199, 0.6);
            transform: translateY(-1px);
        }
        .btn-vice.active {
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.55), rgba(0, 229, 255, 0.45));
            border-color: #ff6ec7;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 110, 199, 0.75);
        }
        /* Custom scrollbar for mobile panels */
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 110, 199, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Conteneur WebGL -->
    <div id="canvas-container"></div>

    <!-- Écran de chargement rétro -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0d061f] transition-opacity duration-700">
        <div class="text-center px-4">
            <h1 class="font-vice text-4xl sm:text-6xl neon-pink-text mb-2 tracking-wide">Vice City</h1>
            <p class="font-hud text-sm sm:text-lg neon-cyan-text tracking-[0.25em] uppercase mb-8">Escobar International Airport</p>
            <div class="w-64 sm:w-80 h-3 bg-gray-900 rounded-full overflow-hidden border border-pink-500/50 mx-auto p-0.5">
                <div id="loader-bar" class="h-full bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 rounded-full w-1/4 transition-all duration-300"></div>
            </div>
            <p class="text-xs text-pink-200/70 font-hud mt-3 tracking-widest">CHARGEMENT DU SECTEUR 1986...</p>
        </div>
    </div>

    <!-- Interface HUD Style GTA Vice City -->
    <div id="hud-overlay" class="fixed inset-0 z-10 pointer-events-none flex flex-col justify-between p-3 sm:p-5">
        
        <!-- Barre supérieure : HUD Rétro & Sélecteur d'ambiance -->
        <div class="flex flex-wrap items-start justify-between gap-3">
            
            <!-- Panneau Ambiance / Moment de la journée -->
            <div class="glass-panel rounded-2xl p-2.5 sm:p-3 pointer-events-auto max-w-full">
                <div class="flex items-center gap-2 mb-1.5 px-1">
                    <span class="w-2 h-2 rounded-full bg-pink-500 animate-ping"></span>
                    <span class="font-hud text-[10px] sm:text-xs text-cyan-300 tracking-wider uppercase font-bold">Ambiance Atmosphérique</span>
                </div>
                <div class="flex flex-wrap gap-1.5" id="mood-controls">
                    <button data-mood="sunset" class="btn-vice active rounded-xl px-2.5 py-1.5 text-xs font-semibold text-pink-100 flex items-center gap-1.5">
                        <span>🌅</span> Coucher de soleil 1986
                    </button>
                    <button data-mood="day" class="btn-vice rounded-xl px-2.5 py-1.5 text-xs font-semibold text-cyan-100 flex items-center gap-1.5">
                        <span>☀️</span> Journée Miami
                    </button>
                    <button data-mood="night" class="btn-vice rounded-xl px-2.5 py-1.5 text-xs font-semibold text-purple-200 flex items-center gap-1.5">
                        <span>🌃</span> Nuit Néon
                    </button>
                </div>
            </div>

            <!-- HUD Classique Vice City (Haut Droite) -->
            <div class="flex flex-col items-end pointer-events-auto ml-auto">
                <div class="glass-panel rounded-2xl px-4 py-2.5 text-right border-pink-500/40">
                    <div class="flex items-center justify-end gap-3">
                        <span id="hud-clock" class="font-hud text-xl sm:text-2xl font-black neon-cyan-text tracking-wider">19:86</span>
                        <span class="px-2 py-0.5 rounded-md bg-pink-600/40 border border-pink-400/50 font-hud text-[10px] text-pink-200 font-bold">★ 0</span>
                    </div>
                    <div class="font-hud text-sm sm:text-base font-bold text-emerald-400 tracking-wider mt-0.5" style="text-shadow: 0 0 8px rgba(52,211,153,0.5);">
                        $00485920
                    </div>
                    <div class="mt-1 pt-1 border-t border-white/10">
                        <span class="font-vice text-lg sm:text-xl neon-pink-text leading-none">Escobar International</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notification / Info zone dynamique -->
        <div id="zone-banner" class="self-center transition-all duration-500 opacity-0 transform translate-y-2">
            <div class="glass-panel rounded-full px-5 py-1.5 border-cyan-400/50">
                <span id="zone-banner-text" class="font-hud text-xs sm:text-sm neon-cyan-text tracking-widest uppercase">Vue Aérienne - Terminal Principal</span>
            </div>
        </div>

        <!-- Barre inférieure : Caméras prédéfinies & Contrôles de navigation -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-end justify-between gap-3">
            
            <!-- Vues prédéfinies rapides -->
            <div class="glass-panel rounded-2xl p-2.5 pointer-events-auto overflow-x-auto">
                <div class="flex items-center justify-between mb-1.5 px-1">
                    <span class="font-hud text-[10px] sm:text-xs text-pink-300 tracking-wider uppercase font-bold">Caméras & Secteurs</span>
                    <button id="toggle-freefly" class="ml-3 px-2.5 py-0.5 rounded-lg text-[11px] font-hud bg-cyan-500/20 border border-cyan-400/60 text-cyan-200 hover:bg-cyan-500/40 transition">
                        Mode Libre: OFF
                    </button>
                </div>
                <div class="flex gap-1.5 min-w-max" id="camera-presets">
                    <button data-cam="aerial" class="btn-vice active rounded-xl px-3 py-2 text-xs font-semibold text-white">
                        🚁 Vue Aérienne
                    </button>
                    <button data-cam="terminal" class="btn-vice rounded-xl px-3 py-2 text-xs font-semibold text-white">
                        🏛️ Terminal Principal
                    </button>
                    <button data-cam="tower" class="btn-vice rounded-xl px-3 py-2 text-xs font-semibold text-white">
                        🗼 Tour de Contrôle
                    </button>
                    <button data-cam="runway" class="btn-vice rounded-xl px-3 py-2 text-xs font-semibold text-white">
                        🛫 Piste & Décollage
                    </button>
                    <button data-cam="apron" class="btn-vice rounded-xl px-3 py-2 text-xs font-semibold text-white">
                        ✈️ Tarmac & Avions
                    </button>
                </div>
            </div>

            <!-- Aide contrôles compacte -->
            <div class="glass-panel rounded-2xl px-3.5 py-2.5 pointer-events-auto text-[11px] text-gray-200 flex flex-wrap items-center justify-between sm:justify-end gap-3">
                <div class="flex items-center gap-2">
                    <span class="px-1.5 py-0.5 rounded bg-white/10 font-hud text-cyan-300">Souris / Tactile</span>
                    <span>Orbite & Zoom</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-1.5 py-0.5 rounded bg-white/10 font-hud text-pink-300">ZQSD / WASD</span>
                    <span>Déplacement libre</span>
                </div>
                <button id="btn-toggle-hud" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold text-white transition">
                    Masquer HUD
                </button>
            </div>
        </div>
    </div>

    <!-- Bouton flottant pour réafficher le HUD s'il est masqué -->
    <button id="btn-show-hud" class="fixed bottom-4 right-4 z-20 hidden glass-panel rounded-full px-4 py-2 text-xs font-hud neon-pink-text pointer-events-auto">
        Afficher HUD
    </button>

    <script>
        // ============================================================================
        // CONFIGURATION GLOBALE & ÉTAT DE LA SCÈNE
        // ============================================================================
        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();
        let currentMood = 'sunset';
        let isFreeFly = false;
        let moveState = { forward: false, backward: false, left: false, right: false, up: false, down: false };
        
        // Éléments animés et dynamiques
        const animatedObjects = {
            radarDish: null,
            airliner: null,
            airlinerProgress: 0,
            airlinerLights: [],
            skimmerPlane: null,
            vehicles: [],
            beaconLights: [],
            runwayLights: [],
            taxiwayLights: [],
            neonMaterials: [],
            windowMaterials: [],
            waterMesh: null,
            palmTrees: []
        };

        // Lumières principales
        let sunLight, hemiLight, ambientLight;
        let skyUniforms;

        // Transitions fluides de caméra
        let targetCamPos = null;
        let targetLookAt = null;
        let isTransitioningCam = false;

        // Définitions des caméras prédéfinies
        const CAMERA_PRESETS = {
            aerial: {
                pos: new THREE.Vector3(-140, 95, 155),
                target: new THREE.Vector3(10, 8, -20),
                label: "Vue Aérienne - Complexe Escobar International"
            },
            terminal: {
                pos: new THREE.Vector3(-68, 22, 72),
                target: new THREE.Vector3(-15, 14, 15),
                label: "Terminal Principal - Architecture Googie 1986"
            },
            tower: {
                pos: new THREE.Vector3(48, 46, 36),
                target: new THREE.Vector3(18, 36, -6),
                label: "Tour de Contrôle & Radar Panoramique"
            },
            runway: {
                pos: new THREE.Vector3(-175, 16, -78),
                target: new THREE.Vector3(40, 12, -95),
                label: "Piste 09/27 - Séquence de Décollage & Atterrissage"
            },
            apron: {
                pos: new THREE.Vector3(62, 14, -22),
                target: new THREE.Vector3(12, 8, -45),
                label: "Tarmac & Aire de Stationnement Air Vice"
            }
        };

        // ============================================================================
        // GÉNÉRATEURS DE TEXTURES PROCÉDURALES (CANVAS 2D)
        // ============================================================================
        function createRunwayTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Asphalte texturé
            ctx.fillStyle = '#23252b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grain asphalte
            for (let i = 0; i < 18000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.08)';
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }

            // Traces de gomme au toucher des roues
            const skidGrad = ctx.createLinearGradient(250, 0, 650, 0);
            skidGrad.addColorStop(0, 'rgba(10,10,12,0)');
            skidGrad.addColorStop(0.3, 'rgba(10,10,12,0.55)');
            skidGrad.addColorStop(1, 'rgba(10,10,12,0)');
            ctx.fillStyle = skidGrad;
            ctx.fillRect(250, 160, 400, 192);

            const skidGrad2 = ctx.createLinearGradient(1400, 0, 1800, 0);
            skidGrad2.addColorStop(0, 'rgba(10,10,12,0)');
            skidGrad2.addColorStop(0.7, 'rgba(10,10,12,0.55)');
            skidGrad2.addColorStop(1, 'rgba(10,10,12,0)');
            ctx.fillStyle = skidGrad2;
            ctx.fillRect(1400, 160, 400, 192);

            // Lignes de bordure blanches
            ctx.fillStyle = '#e5e7eb';
            ctx.fillRect(20, 22, canvas.width - 40, 10);
            ctx.fillRect(20, canvas.height - 32, canvas.width - 40, 10);

            // Barres de seuil (Piano keys) gauche et droite
            for (let y = 48; y < canvas.height - 48; y += 36) {
                ctx.fillRect(35, y, 75, 18);
                ctx.fillRect(canvas.width - 110, y, 75, 18);
            }

            // Numéros de piste "09" et "27"
            ctx.save();
            ctx.fillStyle = '#f3f4f6';
            ctx.font = 'bold 74px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.translate(185, canvas.height / 2);
            ctx.rotate(Math.PI / 2);
            ctx.fillText('09', 0, 0);
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#f3f4f6';
            ctx.font = 'bold 74px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.translate(canvas.width - 185, canvas.height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('27', 0, 0);
            ctx.restore();

            // Ligne médiane discontinue
            for (let x = 270; x < canvas.width - 270; x += 95) {
                ctx.fillRect(x, canvas.height / 2 - 5, 52, 10);
            }

            // Marques de zone de toucher des roues (Touchdown zone)
            ctx.fillRect(320, 140, 90, 24);
            ctx.fillRect(320, canvas.height - 164, 90, 24);
            ctx.fillRect(canvas.width - 410, 140, 90, 24);
            ctx.fillRect(canvas.width - 410, canvas.height - 164, 90, 24);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        function createNeonSignTexture(text, subtext, bgColor, borderColor, textColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = bgColor || '#140826';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cadre néon
            ctx.strokeStyle = borderColor || '#00e5ff';
            ctx.lineWidth = 10;
            ctx.shadowColor = borderColor || '#00e5ff';
            ctx.shadowBlur = 20;
            ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

            // Texte principal
            ctx.fillStyle = textColor || '#ff6ec7';
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 25;
            ctx.font = 'bold 64px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, subtext ? 105 : 128);

            if (subtext) {
                ctx.fillStyle = '#5ce1e6';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 15;
                ctx.font = '36px Pacifico, cursive';
                ctx.fillText(subtext, canvas.width / 2, 185);
            }

            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        function createAirViceLiveryTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Fuselage blanc nacré
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 512, 256);

            // Bandes rétro pastel Vice City (Rose, Violet, Turquoise)
            ctx.fillStyle = '#ff6ec7';
            ctx.fillRect(0, 125, 512, 14);
            ctx.fillStyle = '#a855f7';
            ctx.fillRect(0, 139, 512, 10);
            ctx.fillStyle = '#22d3ee';
            ctx.fillRect(0, 149, 512, 14);

            // Hublots
            ctx.fillStyle = '#1e293b';
            for (let x = 70; x < 440; x += 16) {
                ctx.beginPath();
                ctx.roundRect(x, 96, 8, 13, 3);
                ctx.fill();
            }

            // Logo Air Vice
            ctx.fillStyle = '#db2777';
            ctx.font = 'italic bold 26px Orbitron, sans-serif';
            ctx.fillText('AIR VICE', 95, 82);

            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        // ============================================================================
        // INITIALISATION PRINCIPALE
        // ============================================================================
        function init() {
            const container = document.getElementById('canvas-container');

            // Scène & Brouillard atmosphérique
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x2a1242, 0.0018);

            // Caméra
            camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 1600);
            camera.position.copy(CAMERA_PRESETS.aerial.pos);

            // Renderer WebGL haute qualité
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            container.appendChild(renderer.domElement);

            // Contrôles OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2 - 0.025; // Empêche de passer sous le sol
            controls.minDistance = 8;
            controls.maxDistance = 420;
            controls.target.copy(CAMERA_PRESETS.aerial.target);

            // Arrêter transition auto si l'utilisateur touche à la caméra
            controls.addEventListener('start', () => {
                isTransitioningCam = false;
            });

            // Construction de tous les éléments du monde
            setupSkyAndLighting();
            buildEnvironmentAndBay();
            buildRunwayAndTaxiways();
            buildEscobarTerminal();
            buildControlTower();
            buildHangars();
            buildAircraftFleet();
            buildAirportVehicles();
            buildPalmTreesAndCityFront();

            // Appliquer l'ambiance initiale
            setMood('sunset');

            // Événements UI & Clavier
            setupEventListeners();

            // Masquer l'écran de chargement
            const loaderBar = document.getElementById('loader-bar');
            loaderBar.style.width = '100%';
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 700);
                showZoneBanner(CAMERA_PRESETS.aerial.label);
            }, 600);
        }

        // ============================================================================
        // CIEL DÉGRADÉ SHADER & ÉCLAIRAGE DYNAMIQUE
        // ============================================================================
        function setupSkyAndLighting() {
            // Dôme céleste avec shader personnalisé
            const skyGeo = new THREE.SphereGeometry(750, 32, 24);
            skyUniforms = {
                topColor: { value: new THREE.Color(0x1b0b3b) },
                midColor: { value: new THREE.Color(0xb8336a) },
                bottomColor: { value: new THREE.Color(0xff9a5a) },
                sunDirection: { value: new THREE.Vector3(-0.6, 0.18, -0.75).normalize() },
                sunColor: { value: new THREE.Color(0xffbe76) },
                sunIntensity: { value: 1.0 }
            };

            const skyMat = new THREE.ShaderMaterial({
                uniforms: skyUniforms,
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 midColor;
                    uniform vec3 bottomColor;
                    uniform vec3 sunDirection;
                    uniform vec3 sunColor;
                    uniform float sunIntensity;
                    varying vec3 vWorldPosition;
                    void main() {
                        vec3 dir = normalize(vWorldPosition);
                        float h = clamp(dir.y, 0.0, 1.0);
                        vec3 col = mix(bottomColor, midColor, smoothstep(0.0, 0.28, h));
                        col = mix(col, topColor, smoothstep(0.28, 0.85, h));
                        
                        // Disque solaire rétro Vice City
                        float sunDot = max(dot(dir, normalize(sunDirection)), 0.0);
                        float sunGlow = pow(sunDot, 16.0) * 0.45 * sunIntensity;
                        float sunDisc = smoothstep(0.9965, 0.9985, sunDot) * sunIntensity;
                        
                        // Bandes horizontales rétro sur le soleil couchant
                        if (sunDisc > 0.01 && sunIntensity > 0.5) {
                            float stripe = sin(dir.y * 260.0);
                            if (dir.y < 0.22 && stripe > 0.35) {
                                sunDisc *= 0.15;
                            }
                        }
                        
                        col += sunColor * (sunGlow + sunDisc * 1.4);
                        gl_FragColor = vec4(col, 1.0);
                    }
                `,
                side: THREE.BackSide,
                depthWrite: false
            });
            const skyMesh = new THREE.Mesh(skyGeo, skyMat);
            scene.add(skyMesh);

            // Lumières
            ambientLight = new THREE.AmbientLight(0x6b4c8c, 0.65);
            scene.add(ambientLight);

            hemiLight = new THREE.HemisphereLight(0xff85c0, 0x262936, 0.6);
            scene.add(hemiLight);

            sunLight = new THREE.DirectionalLight(0xffaa66, 1.45);
            sunLight.position.set(-140, 65, -160);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 520;
            const d = 185;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);
        }

        // ============================================================================
        // SOL, TARMAC, BAIE DE VICE CITY & ROUTES D'ACCÈS
        // ============================================================================
        function buildEnvironmentAndBay() {
            // Île principale (herbe tropicale & terrain d'aéroport)
            const islandGeo = new THREE.BoxGeometry(460, 4, 340);
            const islandMat = new THREE.MeshStandardMaterial({
                color: 0x2d5a3c,
                roughness: 0.9,
                metalness: 0.05
            });
            const island = new THREE.Mesh(islandGeo, islandMat);
            island.position.set(0, -2.05, -25);
            island.receiveShadow = true;
            scene.add(island);

            // Plage de sable doré entourant l'île de l'aéroport
            const beachGeo = new THREE.BoxGeometry(478, 3.2, 358);
            const beachMat = new THREE.MeshStandardMaterial({
                color: 0xe6c88a,
                roughness: 0.85
            });
            const beach = new THREE.Mesh(beachGeo, beachMat);

        // ============================================================================
        // HANGARS MÉTALLIQUES À AVIONS
        // ============================================================================
        function buildHangars() {
            const hangarPositions = [
                { x: -125, z: -12, open: true },
                { x: -125, z: 22, open: false }
            ];

            const metalWallMat = new THREE.MeshStandardMaterial({
                color: 0xcbd5e1,

            });

                roughness: 0.5,
                metalness: 0.3
            });
            const interiorDarkMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                side: THREE.DoubleSide
            });

            hangarPositions.forEach((cfg, idx) => {
                const hGroup = new THREE.Group();
                hGroup.position.set(cfg.x, 0, cfg.z);

                // Structure arquée du hangar
                const width = 34;
                const depth = 28;
                const wallH = 11;

                // Murs latéraux et arrière
                const leftWall = new THREE.Mesh(new THREE.BoxGeometry(width, wallH, 1.2), metalWallMat);
                leftWall.position.set(0, wallH / 2, -depth / 2);
                leftWall.castShadow = true;
                hGroup.add(leftWall);

                const rightWall = new THREE.Mesh(new THREE.BoxGeometry(width, wallH, 1.2), metalWallMat);
                rightWall.position.set(0, wallH / 2, depth / 2);
                rightWall.castShadow = true;
                hGroup.add(rightWall);

                const backWall = new THREE.Mesh(new THREE.BoxGeometry(1.2, wallH, depth), metalWallMat);
                backWall.position.set(-width / 2, wallH / 2, 0);
                backWall.castShadow = true;
                hGroup.add(backWall);

                // Toit voûté
                const archRoof = new THREE.Mesh(
                    new THREE.CylinderGeometry(depth / 2, depth / 2, width, 24, 1, false, 0, Math.PI),
                    roofCyanMat
                );
                archRoof.rotation.z = Math.PI / 2;
                archRoof.rotation.x = Math.PI / 2;
                archRoof.scale.set(1, 0.45, 1);
                archRoof.position.set(0, wallH, 0);
                archRoof.castShadow = true;
                hGroup.add(archRoof);

                // Portes coulissantes (ouvertes ou fermées)
                if (!cfg.open) {
                    const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, wallH, depth - 1), metalWallMat);
                    door.position.set(width / 2, wallH / 2, 0);
                    hGroup.add(door);
                } else {

                        new THREE.PlaneGeometry(18, 8),

                    );
                    ceilingLamp.rotation.x = Math.PI / 2;
                    ceilingLamp.position.set(0, wallH - 0.2, 0);
                    hGroup.add(ceilingLamp);
                }

                // Panneau "HANGAR 01 / 02"
                const signTex = createNeonSignTexture(`HANGAR 0${idx + 1}`, "Vice City Maintenance", "#1e1b4b", "#f472b6", "#38bdf8");
                const sign = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.2), new THREE.MeshBasicMaterial({ map: signTex }));
                sign.rotation.y = Math.PI / 2;
                sign.position.set(width / 2 + 0.3, wallH + 2.5, 0);
                hGroup.add(sign);

                scene.add(hGroup);
            });

        // PALMIERS TROPICAUX, LAMPADAIRES NÉON & DÉCOR CÔTÉ VILLE
        // ============================================================================
        function createPalmTree(x, z, scale = 1) {
            const palm = new THREE.Group();
            palm.position.set(x, 0, z);
            palm.scale.setScalar(scale);

            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78553a, roughness: 0.9 });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.6, side: THREE.DoubleSide });

            // Tronc légèrement courbé en segments
            const segments = 6;
            let curY = 0;
            let curX = 0;
            for (let i = 0; i < segments; i++) {
                const segH = 2.1;
                const trunkSeg = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.28 - i * 0.02, 0.35 - i * 0.02, segH, 8),
                    trunkMat
                );
                trunkSeg.position.set(curX, curY + segH / 2, 0);
                trunkSeg.rotation.z = -0.05 * i;
                trunkSeg.castShadow = true;
                palm.add(trunkSeg);
                curY += segH - 0.1;
                curX += 0.12 * i;
            }

            // Couronne de palmes tropicales
            const crown = new THREE.Group();
            crown.position.set(curX, curY, 0);
            const frondCount = 7;
            for (let f = 0; f < frondCount; f++) {
                const angle = (f / frondCount) * Math.PI * 2;
                const frond = new THREE.Mesh(new THREE.ConeGeometry(1.1, 4.8, 4), leafMat);
                frond.scale.set(1, 1, 0.25);
                frond.position.set(Math.cos(angle) * 2.1, -0.4, Math.sin(angle) * 2.1);
                frond.rotation.z = -Math.PI / 2.6;
                frond.rotation.y = -angle;
                frond.castShadow = true;
                crown.add(frond);
            }
            palm.add(crown);
            animatedObjects.palmTrees.push(crown);

            scene.add(palm);
        }

        // ============================================================================
        // CONTRÔLES UTILISATEUR, CAMÉRAS PRÉDÉFINIES & DÉPLACEMENT LIBRE
        // ============================================================================
        function selectCameraPreset(key) {
            const preset = CAMERA_PRESETS[key];
            if (!preset) return;

            document.querySelectorAll('#camera-presets button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cam === key);
            });

            targetCamPos = preset.pos.clone();
            targetLookAt = preset.target.clone();
            isTransitioningCam = true;
            showZoneBanner(preset.label);
        }

        function showZoneBanner(text) {
            const banner = document.getElementById('zone-banner');
            const label = document.getElementById('zone-banner-text');
            label.textContent = text;
            banner.classList.remove('opacity-0', 'translate-y-2');
            banner.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(window.bannerTimeout);
            window.bannerTimeout = setTimeout(() => {
                banner.classList.remove('opacity-100', 'translate-y-0');
                banner.classList.add('opacity-0', 'translate-y-2');
            }, 3400);
        }

        function setupEventListeners() {
            // Sélecteur d'ambiance
            document.querySelectorAll('#mood-controls button').forEach(btn => {
                btn.addEventListener('click', () => setMood(btn.dataset.mood));
            });

            // Vues caméra rapides
            document.querySelectorAll('#camera-presets button').forEach(btn => {
                btn.addEventListener('click', () => selectCameraPreset(btn.dataset.cam));
            });

            // Mode libre ZQSD / WASD
            const freeFlyBtn = document.getElementById('toggle-freefly');
            freeFlyBtn.addEventListener('click', () => {
                isFreeFly = !isFreeFly;
                freeFlyBtn.textContent = isFreeFly ? "Mode Libre: ON" : "Mode Libre: OFF";
                freeFlyBtn.classList.toggle('bg-pink-600/50', isFreeFly);
                if (isFreeFly) {
                    showZoneBanner("Navigation Libre Active : Utilisez ZQSD / WASD + Souris");
                }
            });

            // Masquer / Afficher HUD
            const hudOverlay = document.getElementById('hud-overlay');
            const btnHide = document.getElementById('btn-toggle-hud');
            const btnShow = document.getElementById('btn-show-hud');

            btnHide.addEventListener('click', () => {
                hudOverlay.classList.add('hidden');
                btnShow.classList.remove('hidden');
            });
            btnShow.addEventListener('click', () => {
                hudOverlay.classList.remove('hidden');
                btnShow.classList.add('hidden');
            });

            // Clavier (ZQSD / WASD / Flèches / Espace / Shift)
            window.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'KeyZ':
                    case 'ArrowUp':
                        moveState.forward = true;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        moveState.backward = true;
                        break;
                    case 'KeyA':
                    case 'KeyQ':
                    case 'ArrowLeft':
                        moveState.left = true;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        moveState.right = true;
                        break;
                    case 'Space':
                        moveState.up = true;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        moveState.down = true;
                        break;
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'KeyZ':
                    case 'ArrowUp':
                        moveState.forward = false;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        moveState.backward = false;
                        break;
                    case 'KeyA':
                    case 'KeyQ':
                    case 'ArrowLeft':
                        moveState.left = false;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        moveState.right = false;
                        break;
                    case 'Space':
                        moveState.up = false;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        moveState.down = false;
                        break;
                }
            });

            // Redimensionnement fluide
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ============================================================================
        // BOUCLE D'ANIMATION PRINCIPALE (60 FPS)
        // ============================================================================
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // 1. Rotation de l'antenne radar sur la tour de contrôle
            if (animatedObjects.radarDish) {
                animatedObjects.radarDish.rotation.y += delta * 1.4;
            }

            // 2. Clignotement des balises rouges et des feux de navigation
            const blink = Math.sin(elapsed * 6) > 0;
            animatedObjects.beaconLights.forEach(b => {
                b.visible = blink;
            });

            // 3. Séquence de décollage et montée en boucle de l'avion Air Vice sur la piste 09/27
            if (animatedObjects.airliner) {
                animatedObjects.airlinerProgress += delta * 0.065;
                if (animatedObjects.airlinerProgress > 1) {
                    animatedObjects.airlinerProgress = 0;
                }
                const p = animatedObjects.airlinerProgress;
                const plane = animatedObjects.airliner;

                if (p < 0.45) {
                    // Accélération sur la piste
                    const t = p / 0.45;
                    const easeAccel = t * t;
                    plane.position.set(-185 + easeAccel * 240, 0, -112);
                    plane.rotation.set(0, 0, 0);
                } else if (p < 0.85) {
                    // Rotation & Décollage dans le ciel de Vice City
                    const t = (p - 0.45) / 0.40;
                    plane.position.set(55 + t * 340, Math.pow(t, 1.45) * 95, -112 - t * 25);
                    plane.rotation.z = Math.min(t * 0.35, 0.24);
                    plane.rotation.y = t * 0.08;
                } else {
                    // Approche finale pour atterrissage
                    const t = (p - 0.85) / 0.15;
                    plane.position.set(-340 + t * 155, (1 - t) * 42, -112);
                    plane.rotation.z = -(1 - t) * 0.12;
                    plane.rotation.y = 0;
                }

                // Strobe blanc clignotant sur l'avion
                if (animatedObjects.airlinerLights[2]) {
                    animatedObjects.airlinerLights[2].visible = Math.sin(elapsed * 14) > 0.3;
                }
            }

            // 4. Déplacement des véhicules (Chariot à bagages & Voiture de police Vice City)
            animatedObjects.vehicles.forEach(v => {
                v.mesh.position.x += v.speed * v.dir * delta;
                if (v.mesh.position.x > v.maxX) {
                    v.dir = -1;
                    v.mesh.rotation.y = Math.PI;
                } else if (v.mesh.position.x < v.minX) {
                    v.dir = 1;
                    v.mesh.rotation.y = 0;
                }

                // Gyrophares alternés sur la voiture VCPD
                if (v.sirenRed && v.sirenBlue) {
                    const alt = Math.sin(elapsed * 16) > 0;
                    v.sirenRed.visible = alt;
                    v.sirenBlue.visible = !alt;
                }
            });

            // 5. Légère brise tropicale sur les palmiers
            animatedObjects.palmTrees.forEach((crown, idx) => {
                crown.rotation.z = Math.sin(elapsed * 1.6 + idx) * 0.035;
            });

            // 6. Déplacement libre clavier (ZQSD / WASD)
            const moveSpeed = 55 * delta;
            const forwardDir = new THREE.Vector3();
            camera.getWorldDirection(forwardDir);
            forwardDir.y = 0;
            forwardDir.normalize();

            const rightDir = new THREE.Vector3();
            rightDir.crossVectors(forwardDir, camera.up).normalize();

            if (moveState.forward) {
                camera.position.addScaledVector(forwardDir, moveSpeed);
                controls.target.addScaledVector(forwardDir, moveSpeed);
            }
            if (moveState.backward) {
                camera.position.addScaledVector(forwardDir, -moveSpeed);
                controls.target.addScaledVector(forwardDir, -moveSpeed);
            }
            if (moveState.right) {
                camera.position.addScaledVector(rightDir, moveSpeed);
                controls.target.addScaledVector(rightDir, moveSpeed);
            }
            if (moveState.left) {
                camera.position.addScaledVector(rightDir, -moveSpeed);
                controls.target.addScaledVector(rightDir, -moveSpeed);
            }
            if (moveState.up) {
                camera.position.y += moveSpeed * 0.7;
                controls.target.y += moveSpeed * 0.7;
            }
            if (moveState.down && camera.position.y > 2.5) {
                camera.position.y -= moveSpeed * 0.7;
                controls.target.y -= moveSpeed * 0.7;
            }

            // 7. Interpolation fluide vers une caméra prédéfinie
            if (isTransitioningCam && targetCamPos && targetLookAt) {
                camera.position.lerp(targetCamPos, 0.055);
                controls.target.lerp(targetLookAt, 0.055);
                if (camera.position.distanceTo(targetCamPos) < 0.6) {
                    isTransitioningCam = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Démarrage garanti après chargement complet de la page
        window.onload = function () {
            init();
            animate();
        };
    </script>
</body>
</html>
